<div class="container">
  <div class="details">
    <app-title title="register"></app-title>
    <div class="login">
      Already a user? &nbsp;
      <a routerLink="/login" [queryParams]="{ returnUrl: returnUrl }">Login Here!</a>
    </div>
    <form [formGroup]="registerForm" (ngSubmit)="submit()">
      <text-input
        [control]="fc.name"
        [showErrorsWhen]="isSubmitted"
        label="name"
      ></text-input>
      <text-input
        [control]="fc.email"
        [showErrorsWhen]="isSubmitted"
        label="email"
      ></text-input>
      <text-input
        [control]="fc.password"
        [showErrorsWhen]="isSubmitted"
        label="password"
      ></text-input>
      <text-input
        [control]="fc.confirmPassword"
        [showErrorsWhen]="isSubmitted"
        label="confirmPassword"
      ></text-input>
      <text-input
        [control]="fc.address"
        [showErrorsWhen]="isSubmitted"
        label="address"
      ></text-input>
      <default-button text="Register"></default-button>
    </form>
  </div>
</div>
