<div class="container">
  <div class="details">
    <app-title title="Login"></app-title>

    <form [formGroup]="loginForm" (ngSubmit)="submit()">
      <text-input
        [control]="fc.email"
        [showErrosWhen]="isSubmitted"
        type="email"
        label="email"
      ></text-input>

      <text-input
        [control]="fc.password"
        [showErrosWhen]="isSubmitted"
        type="password"
        label="password"
      ></text-input>
      <div class="register">
        New user? &nbsp;
        <a routerLink="/register" [queryParams]="{ returnUrl: returnUrl }">
          Register Here
        </a>
      </div>
      <default-button text="Login"></default-button>
    </form>
  </div>
</div>
